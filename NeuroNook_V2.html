:root{--bg:#e7f8ff;--blue:#9ad7f4;--dark:#34546d;--pink:#ffd1e7;--rose:#f18fba;--border:#7294ac;--paper:#fffdfc;--mint:#b5eddf;--gold:#ffe7a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#ffe7f2,transparent 36%),linear-gradient(140deg,#e4f6ff,#f5f5ff 55%,#fff0f7);color:var(--dark);font:16px Nunito,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #f38ab6;outline-offset:2px}.app{max-width:1140px;margin:auto;padding:18px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-family:'Press Start 2P',monospace;font-size:15px;line-height:1.8;color:#5c86a8}.logo span{color:#e17cab}.pill{display:inline-block;background:#fff;border:2px solid #9bbbd1;box-shadow:3px 3px 0 #bdd2df;border-radius:6px;padding:8px 11px;font-size:12px;font-weight:900}.hero{text-align:center;padding:24px 10px 18px}.pixel{font-family:'Press Start 2P',monospace;font-size:clamp(16px,3.2vw,29px);line-height:1.65;color:#4b7594;text-shadow:3px 3px 0 #fff}.sub{max-width:690px;margin:12px auto 22px;font-size:17px}.window{border:3px solid var(--border);border-radius:8px;background:var(--paper);box-shadow:7px 7px 0 #b7d6e6;overflow:hidden;margin:15px 0 24px}.windowbar{background:linear-gradient(90deg,#adddf4,#f6cce4);padding:11px 16px;border-bottom:3px solid var(--border);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.6;display:flex;justify-content:space-between;gap:12px}.pad{padding:20px}.btn{border:2px solid #7394ab;background:#fff;box-shadow:3px 3px 0 #a5c0d0;border-radius:5px;padding:11px 14px;font-weight:900;color:#375a73;margin:4px;transition:transform .1s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #a5c0d0}.btn.pink{background:#ffd0e4}.btn.blue{background:#c9edff}.btn.mint{background:#c9f1e5}.btn:disabled{opacity:.5;cursor:default}.flex{display:flex;gap:15px;flex-wrap:wrap;align-items:stretch}.card{background:#fff;border:2px solid #bfd9e6;border-radius:8px;padding:16px;flex:1;min-width:240px}.card h3{margin:5px 0 10px;color:#587e9c}.small{font-size:13px;color:#6b8294}.heading{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.9;color:#6e9cb8}.tag{display:inline-block;background:#eaf6ff;border:1px solid #b9d6e7;padding:4px 8px;border-radius:4px;font-size:12px;margin:3px;font-weight:800}.pinktag{background:#ffedf4}.progress{height:17px;background:#fff;border:2px solid #8aafc7;border-radius:4px;overflow:hidden}.fill{height:100%;background:repeating-linear-gradient(90deg,#f39dc2 0 14px,#ef8cb7 14px 17px);transition:width .3s}.hearts{color:#e77da8;font-size:22px;letter-spacing:3px}.patient{width:94px;height:112px;image-rendering:pixelated;flex:none}.patient svg{width:100%;height:100%;image-rendering:pixelated}.casehead{display:flex;gap:16px;align-items:center}.choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.choice{display:block;text-align:left;margin:0;width:100%;padding:12px}.choice.selected{background:#c4ebfc;border-color:#4d8fbd}.choice.correct{background:#d0f3dc}.choice.wrong{background:#ffe0e5}.panel{border-left:5px solid #b4dff5;background:#f0faff;padding:13px 15px;border-radius:3px;margin:12px 0;line-height:1.6}.panel.pink{border-color:#f2b0cc;background:#fff0f6}.panel.mint{border-color:#93d9bd;background:#f0fff8}.notice{background:#fff8e3;border-left:5px solid #f3d184;padding:12px;margin:12px 0}.scroll{max-height:400px;overflow:auto}.search{width:100%;border:2px solid #9cbdd2;background:#fff;padding:12px;border-radius:5px;color:#34546d}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stat{font-weight:900;color:#577c96}.footer{text-align:center;font-size:12px;color:#7d93a2;padding:20px}.hidden{display:none}.reveal{animation:appear .2s ease}@keyframes appear{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}.star{color:#c779a1}.tab{background:#f1f8ff}.tab.active{background:#ffd7e9}.kbd{font-family:'Press Start 2P',monospace;font-size:10px}.divider{border:0;border-top:2px dashed #c5dce9;margin:20px 0}@media(max-width:700px){.columns{grid-template-columns:1fr}.pad{padding:14px}.app{padding:12px 12px 50px}.windowbar{font-size:9px}.patient{width:74px;height:91px}.casehead{gap:9px}.pill{font-size:11px}}

const CASES=[{"id": 1, "dx": "Migraine with aura", "category": "Neurology", "level": 1, "age": 24, "sex": "woman", "chief": "Recurring headache and shimmering lights", "history": "Gradual visual zigzags lasting 25 minutes followed by unilateral pulsating headache, nausea and photophobia. Similar episodes for years.", "exam": "Normal neurological examination between episodes.", "tests": {"Headache history": "At least five stereotyped headaches, 8–16 hours each; aura evolves over minutes.", "Neurological examination": "No focal deficit, fever, or meningism."}, "clues": "Gradual reversible visual aura preceding headache", "why": "Characteristic stereotyped migraine features; assess red flags before labeling primary headache.", "differentials": "TIA; tension-type headache; occipital seizure", "plan": "Screen for sudden-onset red flags; acute symptom relief and preventive discussion if frequent.", "source": "Clinical synthesis"}, {"id": 2, "dx": "Tension-type headache", "category": "Neurology", "level": 1, "age": 31, "sex": "man", "chief": "Pressure around the head", "history": "Bilateral pressing discomfort after long workdays, without vomiting or aura.", "exam": "Normal neurological examination.", "tests": {"Headache history": "Bilateral nonpulsating mild–moderate pain; physical activity does not worsen it.", "Neurological examination": "No focal abnormalities or red flags."}, "clues": "Bilateral pressing headache without migrainous features", "why": "Features favor tension-type rather than migraine; exclude secondary red flags.", "differentials": "Migraine; medication-overuse headache", "plan": "Discuss sleep, stress, analgesic overuse and appropriate symptomatic care.", "source": "Clinical synthesis"}, {"id": 3, "dx": "Bell palsy", "category": "Neurology", "level": 1, "age": 42, "sex": "woman", "chief": "One side of face suddenly weak", "history": "Over 18 hours, difficulty closing right eye and smiling; no arm weakness or speech disturbance.", "exam": "Right upper and lower facial weakness including forehead; limbs normal.", "tests": {"Cranial nerve examination": "Right peripheral pattern of CN VII weakness; forehead involved.", "Glucose and focused assessment": "No vesicles or other cranial nerve signs; assess alternate causes."}, "clues": "Forehead-involving unilateral facial weakness", "why": "Peripheral facial nerve palsy; central causes and Ramsay Hunt require assessment.", "differentials": "Stroke; Ramsay Hunt syndrome; Lyme disease", "plan": "Protect cornea; prompt clinician assessment for corticosteroids and alternate causes.", "source": "Clinical synthesis"}, {"id": 4, "dx": "Carpal tunnel syndrome", "category": "Neurology", "level": 1, "age": 46, "sex": "woman", "chief": "Nighttime hand tingling", "history": "Thumb, index and middle finger paresthesia wakes her; shaking hand helps.", "exam": "Median-distribution sensory symptoms, possible thenar weakness.", "tests": {"Nerve conduction study": "Median neuropathy at wrist with prolonged distal latency.", "Focused hand examination": "Median distribution symptoms, positive provocative maneuver."}, "clues": "Nocturnal median-nerve paresthesias", "why": "Entrapment at carpal tunnel is supported by clinical pattern and nerve conduction.", "differentials": "Cervical radiculopathy; ulnar neuropathy", "plan": "Splinting, ergonomic assessment; consider specialist referral if weakness or persistent symptoms.", "source": "Clinical synthesis"}, {"id": 5, "dx": "Major depressive disorder", "category": "Psychology", "level": 1, "age": 28, "sex": "woman", "chief": "Low mood and loss of interest", "history": "For 7 weeks, persistent depressed mood, anhedonia, insomnia, poor concentration and guilt, impairing work. No past mania.", "exam": "Psychomotor slowing; coherent thought, no psychosis.", "tests": {"Structured clinical interview": "Five or more depressive symptoms including depressed mood/anhedonia for over 2 weeks, with impairment.", "Safety and medical screen": "Assess suicide risk, bipolar history, substances and medical mimics."}, "clues": "Persistent anhedonia and mood symptoms with impairment", "why": "A major depressive episode is plausible after exclusion of mania, substance and medical explanations.", "differentials": "Adjustment disorder; bipolar depression; hypothyroidism", "plan": "Assess safety, discuss evidence-based psychotherapy and/or medication with a clinician.", "source": "APA depression case examples"}, {"id": 6, "dx": "Panic disorder", "category": "Psychology", "level": 1, "age": 26, "sex": "man", "chief": "Sudden terrifying attacks", "history": "Unexpected surges of palpitations, trembling and fear of dying; worries about more attacks for 2 months.", "exam": "Between attacks, examination unremarkable.", "tests": {"Clinical interview": "Recurrent unexpected panic attacks and persistent concern/behavior change over a month.", "Medical and substance review": "Evaluate cardiac, thyroid, stimulant and other mimics."}, "clues": "Unexpected recurrent panic attacks plus anticipatory anxiety", "why": "Persistent worry after attacks distinguishes disorder from isolated panic attacks.", "differentials": "Hyperthyroidism; arrhythmia; social anxiety", "plan": "Rule out medical causes and discuss CBT with interoceptive exposure.", "source": "Clinical synthesis"}, {"id": 7, "dx": "Generalized anxiety disorder", "category": "Psychology", "level": 1, "age": 35, "sex": "woman", "chief": "Cannot stop worrying", "history": "Excessive worry across finances, family and work most days for 9 months, with restlessness, tension and poor sleep.", "exam": "No psychosis or manic features.", "tests": {"Clinical interview": "Difficult-to-control multi-domain worry over 6 months, associated physical symptoms and impairment.", "Medical review": "Assess caffeine, medication, thyroid and other contributors."}, "clues": "Longstanding pervasive uncontrollable worry", "why": "Time course and breadth of worry favor GAD.", "differentials": "Adjustment disorder; panic disorder; hyperthyroidism", "plan": "Discuss CBT, sleep interventions and treatment options.", "source": "Clinical synthesis"}, {"id": 8, "dx": "Parkinson disease", "category": "Neurology", "level": 1, "age": 67, "sex": "man", "chief": "Slower movement and tremor", "history": "Gradual asymmetric resting hand tremor, smaller handwriting and reduced arm swing.", "exam": "Bradykinesia with rigidity and resting tremor, asymmetric.", "tests": {"Motor examination": "Bradykinesia with decrement, unilateral rigidity and rest tremor.", "Medication and red-flag review": "No dopamine-blocking drug exposure or early severe autonomic failure."}, "clues": "Bradykinesia plus resting tremor and rigidity", "why": "Clinical parkinsonism with typical asymmetry supports Parkinson disease.", "differentials": "Essential tremor; drug-induced parkinsonism; PSP", "plan": "Neurology review; functional goals, exercise and dopaminergic treatment discussion.", "source": "Physiopedia neurological case studies"}, {"id": 9, "dx": "Essential tremor", "category": "Neurology", "level": 1, "age": 59, "sex": "woman", "chief": "Hands shake when holding a cup", "history": "Bilateral action tremor for 8 years, worse with stress, no slowness or stiffness.", "exam": "Postural and kinetic tremor without bradykinesia.", "tests": {"Motor examination": "Bilateral action tremor; no parkinsonian bradykinesia.", "Medication and thyroid review": "Consider enhanced physiological tremor and thyroid disease."}, "clues": "Action tremor without bradykinesia", "why": "Longstanding bilateral kinetic tremor is characteristic.", "differentials": "Parkinson disease; hyperthyroidism", "plan": "Assess disability, triggers and treatment options.", "source": "Clinical synthesis"}, {"id": 10, "dx": "Alzheimer disease", "category": "Neuropsychology", "level": 2, "age": 73, "sex": "woman", "chief": "Gradual worsening memory", "history": "Over 3 years repeats questions, misplaces objects and needs help with finances; gradual progression.", "exam": "Impaired delayed recall with limited cue benefit; daily functioning affected.", "tests": {"Cognitive assessment": "Episodic memory encoding/storage impairment and multidomain cognitive deficits.", "MRI brain and reversible-cause labs": "Medial temporal atrophy; check B12, TSH and other contributors."}, "clues": "Insidious progressive episodic-memory and functional decline", "why": "Pattern suggests Alzheimer clinical syndrome; biomarkers may be considered where appropriate.", "differentials": "Depression; vascular cognitive impairment; Lewy body dementia", "plan": "Comprehensive dementia assessment, support planning and discussion of appropriate therapies.", "source": "Clinical synthesis"}, {"id": 11, "dx": "Vascular cognitive impairment", "category": "Neuropsychology", "level": 2, "age": 72, "sex": "man", "chief": "Thinking slowed after strokes", "history": "Stepwise cognitive decline with hypertension and prior infarcts; planning worse than recall.", "exam": "Executive slowing, mild left-sided weakness.", "tests": {"MRI brain": "Multiple strategic infarcts and extensive small-vessel disease.", "Neuropsychological assessment": "Executive and processing-speed deficits predominate."}, "clues": "Executive deficits with vascular injury", "why": "Temporal relationship and imaging support vascular contribution.", "differentials": "Alzheimer disease; depression", "plan": "Optimize vascular risks and arrange multidisciplinary cognitive support.", "source": "Clinical synthesis"}, {"id": 12, "dx": "Lewy body dementia", "category": "Neuropsychology", "level": 3, "age": 76, "sex": "man", "chief": "Memory issues and seeing people", "history": "Fluctuating attention, detailed visual hallucinations and dream enactment before major memory complaints.", "exam": "Parkinsonism and impaired visuospatial performance.", "tests": {"Cognitive examination": "Marked attention and visuospatial deficits with fluctuations.", "Sleep and movement history": "Probable REM sleep behavior disorder and spontaneous parkinsonism."}, "clues": "Fluctuations, hallucinations, REM sleep behavior and parkinsonism", "why": "Core clinical features suggest dementia with Lewy bodies.", "differentials": "Alzheimer disease; delirium; Parkinson disease dementia", "plan": "Specialist evaluation; caution with antipsychotic sensitivity.", "source": "Clinical synthesis"}, {"id": 13, "dx": "Frontotemporal dementia, behavioral variant", "category": "Neuropsychology", "level": 3, "age": 59, "sex": "woman", "chief": "Personality has changed", "history": "Progressive disinhibition, apathy, loss of empathy and rigid food habits over 2 years.", "exam": "Executive dysfunction; memory relatively spared early.", "tests": {"Behavioral and collateral interview": "Progressive early behavioral disinhibition and loss of empathy.", "MRI brain": "Frontal and anterior temporal-predominant atrophy."}, "clues": "Early behavioral change over memory loss", "why": "Behavioral syndrome and frontotemporal pattern favor bvFTD.", "differentials": "Primary psychiatric disorder; Alzheimer disease", "plan": "Specialist assessment, caregiver support and safety planning.", "source": "Clinical synthesis"}, {"id": 14, "dx": "Multiple sclerosis", "category": "Neurology", "level": 2, "age": 29, "sex": "woman", "chief": "Vision loss then leg numbness", "history": "Painful monocular vision loss 9 months ago resolved; now subacute sensory and gait symptoms.", "exam": "Hyperreflexia, internuclear ophthalmoplegia, patchy sensory deficit.", "tests": {"MRI brain and spine": "Typical periventricular and spinal demyelinating lesions with dissemination in space; differing enhancement.", "CSF oligoclonal bands": "CSF-restricted oligoclonal bands support inflammatory demyelination."}, "clues": "Separate CNS demyelinating episodes", "why": "Clinical attacks plus MRI/CSF may meet contemporary diagnostic criteria after excluding mimics.", "differentials": "NMOSD; MOGAD; B12 deficiency", "plan": "Urgent specialist assessment for relapse and disease-modifying treatment.", "source": "Physiopedia neurological case studies"}, {"id": 15, "dx": "Myasthenia gravis", "category": "Neurology", "level": 2, "age": 34, "sex": "woman", "chief": "Drooping eyelids in evenings", "history": "Fluctuating ptosis and double vision, worse after activity, improves with rest.", "exam": "Fatigable ptosis and variable ocular weakness; normal sensation.", "tests": {"AChR antibody test": "Acetylcholine receptor antibodies positive.", "Repetitive nerve stimulation": "Decremental compound muscle action potentials."}, "clues": "Fatigable weakness without sensory loss", "why": "Neuromuscular junction dysfunction supported by antibody/electrophysiology.", "differentials": "Thyroid eye disease; botulism; cranial neuropathy", "plan": "Assess breathing and swallowing urgently if affected; specialist treatment.", "source": "Clinical synthesis"}, {"id": 16, "dx": "Guillain–Barré syndrome", "category": "Neurology", "level": 2, "age": 41, "sex": "man", "chief": "Weak legs progressing upward", "history": "One week after gastroenteritis, progressive symmetrical weakness and tingling over 4 days.", "exam": "Areflexia, symmetric ascending weakness.", "tests": {"Nerve conduction studies": "Demyelinating polyradiculoneuropathy pattern.", "Lumbar puncture": "Raised CSF protein with few cells may emerge after first week."}, "clues": "Rapid ascending weakness and areflexia", "why": "Acute inflammatory polyradiculoneuropathy; early CSF can be normal.", "differentials": "Spinal cord compression; myasthenia; tick paralysis", "plan": "Hospital assessment for respiratory and autonomic monitoring; IVIG or plasma exchange.", "source": "Physiopedia neurological case studies"}, {"id": 17, "dx": "Focal temporal lobe epilepsy", "category": "Neurology", "level": 2, "age": 22, "sex": "woman", "chief": "Brief strange spells", "history": "Repeated 60-second episodes of déjà vu, rising epigastric sensation and impaired awareness with lip smacking.", "exam": "Normal between events.", "tests": {"EEG": "Interictal temporal epileptiform discharges may be present.", "MRI epilepsy protocol": "Possible mesial temporal sclerosis; normal imaging does not exclude epilepsy."}, "clues": "Brief stereotyped impaired-awareness spells", "why": "Semiology supports focal temporal seizures; EEG can support but not independently exclude.", "differentials": "Panic attacks; syncope; dissociation", "plan": "Seizure safety, specialist assessment and appropriate antiseizure treatment.", "source": "Clinical synthesis"}, {"id": 18, "dx": "Ischemic stroke", "category": "Neurology", "level": 2, "age": 68, "sex": "woman", "chief": "Sudden inability to speak", "history": "Abrupt aphasia and right arm weakness 45 minutes ago.", "exam": "Right face/arm weakness, aphasia; glucose normal.", "tests": {"Noncontrast CT head": "No intracranial hemorrhage on initial scan.", "CT angiography": "Left middle cerebral artery large-vessel occlusion."}, "clues": "Hyperacute focal neurological deficit", "why": "Time-critical vascular syndrome; imaging directs reperfusion eligibility.", "differentials": "Hypoglycemia; seizure with Todd paresis; migraine aura", "plan": "Activate emergency stroke pathway immediately; assess reperfusion options.", "source": "Clinical synthesis"}, {"id": 19, "dx": "Transient ischemic attack", "category": "Neurology", "level": 2, "age": 64, "sex": "man", "chief": "Speech suddenly stopped then returned", "history": "Abrupt language disturbance lasting 12 minutes, now completely resolved; vascular risk factors.", "exam": "Neurological examination normal now.", "tests": {"Urgent vascular imaging": "Carotid stenosis may be found; normal imaging does not rule out TIA.", "Brain MRI DWI": "No acute infarction; absence of DWI lesion does not exclude TIA."}, "clues": "Brief abrupt focal deficit without residual symptoms", "why": "Possible transient cerebral ischemia requires urgent stroke evaluation.", "differentials": "Migraine aura; focal seizure; hypoglycemia", "plan": "Same-day emergency assessment and secondary prevention workup.", "source": "Clinical synthesis"}, {"id": 20, "dx": "Concussion", "category": "Neurology", "level": 2, "age": 19, "sex": "woman", "chief": "Foggy after collision", "history": "Head impact during sport, headache and slowed thinking, no focal deficit; no worsening red flags.", "exam": "Balance mildly impaired, GCS 15.", "tests": {"Concussion symptom assessment": "Headache, cognitive fog and light sensitivity after impact.", "Red flag and CT decision assessment": "No high-risk signs; imaging decision uses validated clinical rules."}, "clues": "Post-traumatic transient neurological symptoms", "why": "Clinical concussion diagnosis; routine CT does not diagnose concussion.", "differentials": "Intracranial bleed; vestibular injury", "plan": "Remove from play, monitor red flags and graded return to activity.", "source": "Physiopedia neurological case studies"}, {"id": 21, "dx": "Obsessive-compulsive disorder", "category": "Psychology", "level": 2, "age": 23, "sex": "man", "chief": "Repeated checking consumes hours", "history": "Intrusive fear of fire; checks stove repeatedly despite recognizing excessiveness, 2 hours daily.", "exam": "Anxious, intact reality testing.", "tests": {"Structured symptom interview": "Obsessions and compulsions are time-consuming and distressing.", "Differential and insight assessment": "Thoughts intrusive; rituals aim to reduce anxiety, not delusion-driven."}, "clues": "Intrusive obsessions and neutralizing rituals", "why": "Compulsions distinguish OCD from ordinary caution or generalized worry.", "differentials": "OCPD; psychotic disorder; GAD", "plan": "Exposure and response prevention with clinician support; consider medication.", "source": "Clinical synthesis"}, {"id": 22, "dx": "Post-traumatic stress disorder", "category": "Psychology", "level": 2, "age": 38, "sex": "woman", "chief": "Nightmares after an assault", "history": "For 4 months has trauma-related intrusions, avoidance, hypervigilance and negative mood affecting daily life.", "exam": "Startles easily; oriented, no psychosis.", "tests": {"Trauma-focused interview": "Intrusions, avoidance, negative cognition/mood and arousal for over a month.", "Safety and comorbidity assessment": "Assess current safety, depression, substance use and dissociation."}, "clues": "Persistent multi-cluster symptoms after trauma", "why": "Duration and symptom clusters support PTSD; avoid unnecessary detailed trauma retelling.", "differentials": "Acute stress disorder; adjustment disorder", "plan": "Offer trauma-focused evidence-based psychotherapy and supportive care.", "source": "Clinical synthesis"}, {"id": 23, "dx": "Bipolar I disorder", "category": "Psychology", "level": 2, "age": 30, "sex": "man", "chief": "Sleeping 2 hours and making grand plans", "history": "One week of elevated/irritable mood, marked energy, pressured speech, impulsive spending and major impairment; prior depressive episodes.", "exam": "Grandiosity, distractibility and psychomotor activation.", "tests": {"Longitudinal mood interview": "Syndromal mania with impairment for at least a week or requiring hospitalization.", "Substance and medical assessment": "Evaluate stimulants, thyroid disease and medication-induced symptoms."}, "clues": "Manic episode with marked functional impairment", "why": "History of mania establishes bipolar I rather than unipolar depression.", "differentials": "Stimulant-induced mania; schizoaffective disorder", "plan": "Assess risk and need for urgent psychiatric care; mood stabilization.", "source": "Clinical synthesis"}, {"id": 24, "dx": "Social anxiety disorder", "category": "Psychology", "level": 2, "age": 20, "sex": "woman", "chief": "Avoids presentations", "history": "For 2 years fears negative judgment in class and social situations, avoids them, causing academic impairment.", "exam": "No panic outside feared social evaluation.", "tests": {"Clinical interview": "Persistent fear of scrutiny and avoidance for more than 6 months.", "Differential assessment": "Evaluate autism, panic disorder and normative shyness."}, "clues": "Persistent fear of negative evaluation", "why": "Fear is tied to social scrutiny rather than unexpected attacks.", "differentials": "Panic disorder; avoidant personality traits", "plan": "CBT with graduated exposure; individualized treatment discussion.", "source": "Clinical synthesis"}, {"id": 25, "dx": "ADHD, predominantly inattentive presentation", "category": "Psychology", "level": 2, "age": 17, "sex": "boy", "chief": "Cannot organize schoolwork", "history": "Since primary school forgetful, loses materials, distractible at home and school; longstanding impairment.", "exam": "Normal neurological examination.", "tests": {"Developmental and school collateral": "Several inattentive symptoms before age 12 in at least two settings.", "Learning and mood evaluation": "Assess sleep, anxiety, depression and learning disorder mimics."}, "clues": "Childhood-onset cross-setting inattention", "why": "Developmental pattern is required; attention difficulties alone are nonspecific.", "differentials": "Anxiety; sleep deprivation; learning disorder", "plan": "Multimodal supports and formal specialist evaluation.", "source": "Clinical synthesis"}, {"id": 26, "dx": "Schizophrenia", "category": "Psychology", "level": 3, "age": 25, "sex": "man", "chief": "Hearing voices and withdrawing", "history": "Eight months of functional decline, persecutory delusions, auditory hallucinations and disorganized speech; no sustained mood episode.", "exam": "Thought disorder, blunted affect and impaired functioning.", "tests": {"Psychiatric longitudinal interview": "Active psychotic symptoms with continuous disturbance over six months.", "Medical and substance screen": "Exclude substance-induced, mood-related and neurological causes."}, "clues": "Psychosis with sustained functional deterioration", "why": "Time course and syndrome support schizophrenia after differential evaluation.", "differentials": "Schizophreniform disorder; bipolar psychosis; substance-induced psychosis", "plan": "Collaborative early psychosis service, safety assessment and treatment.", "source": "Lumen abnormal psychology"}, {"id": 27, "dx": "Stimulant-induced psychotic disorder", "category": "Psychology", "level": 3, "age": 28, "sex": "woman", "chief": "New paranoia and agitation", "history": "Persecutory beliefs began shortly after a prescribed stimulant dose increase; no previous psychotic history.", "exam": "Agitated and suspicious; vital signs require assessment.", "tests": {"Medication timeline": "Psychotic symptoms closely track stimulant exposure and improve after discontinuation.", "Substance and medical assessment": "Evaluate other substances, delirium and underlying primary psychosis."}, "clues": "Psychosis temporally linked to stimulant exposure", "why": "Medication temporal association strongly informs differential, but follow-up is necessary.", "differentials": "Schizophrenia; bipolar mania; delirium", "plan": "Urgent safety assessment and prescriber-led medication review.", "source": "Lumen schizophrenia cases"}, {"id": 28, "dx": "Schizoaffective disorder", "category": "Psychology", "level": 4, "age": 36, "sex": "man", "chief": "Psychosis with major mood episodes", "history": "Years of psychosis with major depressive episodes occupying most illness duration; also hallucinations for 3 weeks without mood symptoms.", "exam": "Current depressed mood with delusional thinking.", "tests": {"Detailed longitudinal timeline": "At least two weeks of psychosis without a major mood episode; mood episodes present for majority of illness.", "Medical and substance evaluation": "No substance or medical cause identified."}, "clues": "Psychosis outside mood episodes plus predominant mood illness", "why": "Longitudinal proportion of mood episodes differentiates from schizophrenia or mood disorder with psychotic fe function home(){mode='home';let done=saved.done.length;$('#root').innerHTML=`<div class="hero"><div class="pixel">WELCOME TO<br>NEURONOOK ♡<br><span style="font-size:11px">VERSION 2</span></div><p class="sub">Version 2: a cozy pixel hospital with patient interviews, interactive simulated investigations, written diagnoses and clinical reasoning. Learn the science of mind and brain, then put your clinical reasoning to the test.</p><div class="hearts">♥ ♥ ♥ ♥ ♥</div></div>${box('HOW TO PLAY',`<div class="flex"><div class="card"><div class="heading">01 / LEARN</div><p>Open your illustrated field guide. Study symptoms, diagnostic reasoning, investigations, differentials and next steps. Mark conditions as learned.</p></div><div class="card"><div class="heading">02 / DIAGNOSE</div><p>Meet a patient with limited information. Request history, examine them or order tests. Most reveals cost points; emergency screening is free. Type or select a diagnosis to finish the case.</p></div><div class="card"><div class="heading">03 / LEVEL UP</div><p>Start with common conditions, then progress to complex neurological and psychiatric presentations. Correct answers unlock the next level.</p></div></div><div class="notice"><b>Clinical rule:</b> real clinicians prioritize patient safety over speed. Emergency assessment is never penalized in real life; this game scores information efficiency for learning only.</div><div style="text-align:center">${btn('♡ START LEARNING','learn()','pink')}${btn('✚ ENTER CLINIC','clinic()','blue')}</div>`)}${box('YOUR CLINIC RECORD',`<div class="flex"><div class="card"><div class="heading">${CASES.length} CASES</div><p>Across neurology, psychology and neuropsychology</p></div><div class="card"><div class="heading">${done} SOLVED</div><p>Clinical cases completed</p></div><div class="card"><div class="heading">${saved.learned.length} LEARNED</div><p>Conditions marked studied</p></div></div><p class="small">Your progress is saved locally in this browser. Clearin function updateLearnList(){let arr=CASES.filter(c=>(filter==='All'||c.category===filter)&&(`${c.dx} ${c.category}`.toLowerCase().includes(learnSearch.toLowerCase())));$('#learnlist').innerHTML=learnList(arr)}
function setFilter(f){filter=f;learn()}
function lesson(id){mode='lesson';let c=CASES.find(x=>x.id===id);$('#root').innerHTML=box(`LEARN / ${escapeHTML(c.category.toUpperCase())}`,`<div class="casehead">${avatar(c.id)}<div><span class="tag">LEVEL ${c.level}</span><div class="heading">${escapeHTML(c.dx)}</div><p class="small">A diagnostic field guide</p></div></div><hr class="divider"><div class="panel pink"><b>Classic presentation</b><p>${escapeHTML(c.history)}</p></div><div class="panel"><b>Diagnostic reasoning</b><p>${escapeHTML(c.why)}</p><b>Key clinical clue:</b> ${escapeHTML(c.clues)}</div><div class="columns"><div class="card"><b>What to investigate</b>${Object.entries(c.tests).map(([k,v])=>`<p><b>${escapeHTML(k)}</b><br>${escapeHTML(v)}</p>`).join('')}</div><div class="card"><b>Important differentials</b><p>${escapeHTML(c.differentials)}</p><b>Next steps</b><p>${escapeHTML(c.plan)}</p></div></div><p class="small">Educational synthesis • ${escapeHTML(c.source)}. Case details are fictional, not a verbatim published case.</p><div>${btn('← Back to library','learn()')}${btn(saved.learned.includes(id)?'✓ Studied':'♡ Mark as learned',`markLearned(${id})`,'pink')}${btn('Try a clinical case',`startCase(${id})`,'blue')}</div>`)}
function markLearned(id){if(!saved.learned.includes(id)){saved.learned.push(id);saved.xp+=15}persist();lesson(id)}
function unlocked(){return Math.min(5,1+Math.floor(saved.done.length/5))}
// NeuroNook V2 — offline clinical simulation engine
const V2KEY='neuronook_v2_preferences';
let v2Settings={mode:'hybrid',showInterpretation:true};try{Object.assign(v2Settings,JSON.parse(localStorage.getItem(V2KEY)||'{}'))}catch(e){}
const TESTBANK={
'MRI':{type:'MRI',questions:['Which finding most directly supports the leading diagnosis?','Which feature of the scan is diagnostically useful?']},
'EEG':{type:'EEG',questions:['What does the EEG pattern suggest?']},
'CT':{type:'CT',questions:['Which imaging feature is most clinically relevant?']},
'CSF':{type:'CSF',questions:['What is the key CSF finding?']},
'Cognitive':{type:'Cognition',questions:['Which cognitive domain is most affected?']},
'Neuropsych':{type:'Cognition',questions:['Which cognitive domain is most affected?']},
'Clinical':{type:'Clinical',questions:['Which observation best fits the presentation?']}
};
const normalized=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
const ALIASES={
'Major depressive disorder':['mdd','major depression','unipolar depression'],
'Generalized anxiety disorder':['gad','generalised anxiety disorder'],
'Obsessive-compulsive disorder':['ocd'],
'Post-traumatic stress disorder':['ptsd','post traumatic stress disorder'],
'Attention-deficit/hyperactivity disorder':['adhd'],
'Multiple sclerosis':['ms'],
'Alzheimer disease':['alzheimers','alzheimer dementia','alzheimers disease'],
'Parkinson disease':['pd','parkinsons disease'],
'Amyotrophic lateral sclerosis':['als','motor neuron disease','lou gehrigs disease'],
'Guillain-Barré syndrome':['gbs','guillain barre syndrome'],
'Frontotemporal dementia, behavioral variant':['bvftd','behavioral variant frontotemporal dementia','behavioural variant frontotemporal dementia'],
'Lewy body dementia':['dementia with lewy bodies','dlb'],
'Normal pressure hydrocephalus':['nph'],
'Creutzfeldt-Jakob disease':['cjd'],
'Bipolar I disorder':['bipolar 1 disorder','bipolar type 1'],
'Transient ischemic attack':['tia'],
'Ischemic stroke':['ischaemic stroke','cerebral infarction'],
'Idiopathic intracranial hypertension':['iih'],
'Cerebral venous sinus thrombosis':['cvst','cerebral venous thrombosis'],
'Myasthenia gravis':['mg'],
'Wilson disease':['wilsons disease']
};
const isCorrect=(guess,c)=>[c.dx,...(ALIASES[c.dx]||[])].some(x=>normalized(x)===normalized(guess));
const HINTLABELS=['Symptom timeline','Medical and family history','Functional impact','Red flags and safety'];
function safetyFor(c){let t=(c.chief+' '+c.history+' '+c.exam+' '+c.plan).toLowerCase();if(/stroke|sudden|seizure|papilledema|mening|encephalitis|hemorrhag|suicid|self.harm|bradycardia|orthostatic|weakness|thunderclap|rapidly progressive/.test(t))return 'SAFETY FIRST: evaluate acute instability, neurologic red flags, or risk to self/others promptly. Urgent assessment is always free in this simulation.';return 'SAFETY CHECK: ask about acute changes, immediate risk, medicines, and medical mimics before concluding.'}
function timeline(c){return c.history.split(/[.;]/).filter(Boolean).slice(0,2).join('. ').trim()+'.'}
function historyDetail(c,k){let text=c.history;switch(k){case 'timeline':return timeline(c);case 'background':return 'Additional history: '+text+' Review medications, substances, family history and prior episodes as clinically relevant.';case 'function':return 'Daily-life impact and course: '+text+' Clarify baseline functioning and collateral history when appropriate.';case 'safety':return safetyFor(c);default:return text}}
function testType(name){let n=name.toLowerCase();if(/mri|magnetic/.test(n))return 'MRI';if(/eeg|electroencephal/.test(n))return 'EEG';if(/ct |ct$|tomograph/.test(n))return 'CT';if(/csf|lumbar puncture/.test(n))return 'CSF';if(/neuropsych|cognitive|memory/.test(n))return 'Cognition';if(/blood|lab|serum|thyroid|vitamin|glucose|electrolyte/.test(n))return 'Lab';return 'Clinical'}
function testVisual(c,name,report){let type=testType(name),seed=c.id,blocks='';if(type==='EEG'){
 let pts=[];for(let i=0;i<190;i++){let y=56+Math.sin(i*.23+seed)*9+Math.sin(i*.78)*4+(i%47<5?Math.sin(i*2)*14:0);pts.push(`${i*2.2},${y.toFixed(1)}`)}blocks=`<polyline points="${pts.join(' ')}" fill="none" stroke="#6187ba" stroke-width="2"/><path d="M0 88 H420" stroke="#cbddeb" stroke-dasharray="4 5"/>`;
}else if(type==='MRI'||type==='CT'){
 blocks=`<ellipse cx="210" cy="66" rx="73" ry="55" fill="#74859e" stroke="#465a76" stroke-width="5"/><ellipse cx="210" cy="66" rx="62" ry="47" fill="#bcc6d3"/><path d="M210 18 Q196 35 206 50 Q190 68 207 85 Q199 101 210 113 M210 18 Q225 35 215 50 Q230 68 214 85 Q224 101 210 113" fill="none" stroke="#687c99" stroke-width="5"/><ellipse cx="${195+seed%24}" cy="${52+seed%18}" rx="${9+seed%8}" ry="${6+seed%5}" fill="#f2c6d8" opacity=".85"/><text x="10" y="14" fill="#65839e" font-size="11">SIMULATED ${type} SCHEMATIC</text>`;
}else if(type==='Lab'||type==='CSF'){
 blocks=Array.from({length:5},(_,i)=>`<rect x="${30+i*80}" y="${30+i%2*9}" width="42" height="${60-i*6}" rx="4" fill="${i===seed%5?'#ee99c0':'#9ed4e9'}"/><path d="M${30+i*80} 95h42" stroke="#597e9d"/>`).join('');
}else if(type==='Cognition'){
 blocks=Array.from({length:6},(_,i)=>`<rect x="${25+i*65}" y="${95-(i*17+seed*7)%58}" width="36" height="${(i*17+seed*7)%58+10}" fill="${i===seed%6?'#ef91ba':'#99cde7'}"/>`).join('');
}else{
 blocks='<path d="M10 66 H65 L83 43 L103 87 L128 27 L147 66 H215 L235 55 L253 76 L274 66 H410" fill="none" stroke="#ee93b9" stroke-width="4"/>';
}
return `<div class="visual" role="img" aria-label="Illustrative, synthetic ${escapeHTML(type)} graphic, not a real patient investigation"><svg viewBox="0 0 420 130" preserveAspectRatio="xMidYMid meet">${blocks}</svg><div class="small"><b>SIMULATED ${escapeHTML(type.toUpperCase())} — NOT A REAL CLINICAL IMAGE.</b> Interpret the written report below; graphic is decorative and does not encode diagnostic data.</div></div>`}
function testChallenge(c,k){let name=Object.keys(c.tests)[Number(k.slice(4))],result=c.tests[name],wrong=c.differentials.split(';').map(x=>x.trim()).filter(Boolean);let opts=[result,...wrong.slice(0,2).map((d,i)=>`Finding specifically diagnostic of ${d} without supporting evidence`)];opts.push('This investigation alone definitively excludes all alternative diagnoses.');return {name,result,opts:opts.sort((a,b)=>hash(a+c.id)-hash(b+c.id))}}
function clinic(){mode='clinic';let lv=unlocked();$('#root').innerHTML=box('DOCTOR MODE / CASE BOARD',`<div class="heading">THE PIXEL CLINIC IS OPEN</div><p>52 fictional patient scenarios across 5 progressively harder levels. Work through an interview, clinical examination, simulated investigations, and a differential before diagnosing.</p><div class="progress"><div class="fill" style="width:${lv/5*100}%"></div></div><p class="small">Unlocked level ${lv}/5 • ${saved.done.length}/${CASES.length} solved • Solve five distinct cases to unlock the next level.</p><p>${btn('♡ Next unsolved patient','nextCase()','pink')}${btn('↻ Random available case','randomCase()','blue')}</p><div class="choicegrid">${CASES.filter(c=>c.level<=lv).map(c=>`<button class="btn choice" onclick="startCase(${c.id})"><span class="tag">LEVEL ${c.level}</span> <span class="tag pinktag">${escapeHTML(c.category)}</span><br><b>Patient ${String(c.id).padStart(3,'0')} ${saved.done.includes(c.id)?'✓':''}</b><br><span class="small">${escapeHTML(c.chief)}</span></button>`).join('')}</div>`);persist()}
function nextCase(){let c=CASES.find(c=>c.level<=unlocked()&&!saved.done.includes(c.id));startCase((c||CASES[0]).id)}
function randomCase(){let pool=CASES.filter(c=>c.level<=unlocked());startCase(pool[Math.floor(Math.random()*pool.length)].id)}
function startCase(id){let c=CASES.find(c=>c.id===id);active={id,score:120+20*c.level,seen:[],wrong:0,finished:false,diagnosis:null,feedback:'',notes:[],testAnswers:{},differential:[],tab:'interview',urgentChecked:false};renderCase()}
function switchTab(tab){active.tab=tab;renderCase()}
function reveal(k){if(!active||active.finished||active.seen.includes(k))return;active.seen.push(k);let cost=k==='safety'?0:k==='hint'?22:k==='exam'?8:k.startsWith('test')?14:7;active.score=Math.max(10,active.score-cost);active.feedback='';renderCase()}
function urgent(){if(active.finished)return;active.urgentChecked=true;active.feedback='safety';renderCase()}
function choices(c){let pool=[c.dx,...c.differentials.split(';').map(x=>x.trim()).filter(Boolean)];return [...new Set(pool)].slice(0,5).sort((a,b)=>hash(a+c.id)-hash(b+c.id))}
function hash(s){let h=0;for(let ch of s)h=(h*31+ch.charCodeAt(0))|0;return h}
function submitFree(){let val=$('#freeDx')?.value?.trim();if(!val)return;diagnose(val)}
function diagnose(s){if(!active||active.finished)return;let c=CASES.find(x=>x.id===active.id);if(isCorrect(s,c)){active.finished=true;active.diagnosis=c.dx;active.feedback='correct';if(!saved.done.includes(c.id)){saved.done.push(c.id);saved.xp+=active.score}persist()}else{active.wrong++;active.score=Math.max(10,active.score-23);active.feedback=`“${s}” is not the target diagnosis. Reassess the differential. A new clue was unlocked.`;let extra=['timeline','background','function','exam',...Object.keys(c.tests).map((_,i)=>'test'+i),'hint'].find(k=>!active.seen.includes(k));if(extra)active.seen.push(extra)}renderCase()}
function interpret(k,i){if(active.finished)return;let c=CASES.find(x=>x.id===active.id),q=testChallenge(c,k);active.testAnswers[k]=i===q.opts.indexOf(q.result)?'correct':'review';if(i!==q.opts.indexOf(q.result))active.score=Math.max(10,active.score-5);renderCase()}
function toggleDifferential(name){let a=active.differential;if(a.includes(name))active.differential=a.filter(x=>x!==name);else a.push(name);renderCase()}
function renderCase(){mode='case';let a=active,c=CASES.find(x=>x.id===a.id),keys=Object.keys(c.tests),max=120+20*c.level;let tabs=[['interview','Interview'],['exam','Examination'],['tests','Investigations'],['diagnose','Diagnosis']];let chart=a.seen.map(k=>{let label,value;if(k==='exam'){label='Focused examination';value=c.exam}else if(k==='hint'){label='Clinical reasoning hint';value=c.clues}else if(k.startsWith('test')){label=keys[+k.slice(4)];value=c.tests[label]}else{label=HINTLABELS[['timeline','background','function','safety'].indexOf(k)]||'Interview';value=historyDetail(c,k)}return `<div class="panel ${k==='hint'?'pink':''}"><b>${escapeHTML(label)}</b><p>${escapeHTML(value)}</p></div>`}).join('');
let body='';if(a.finished){body=`<div class="panel mint"><div class="heading">★ DIAGNOSIS CONFIRMED!</div><h2>${escapeHTML(c.dx)}</h2><p><b>Reasoning:</b> ${escapeHTML(c.why)}</p><p><b>Important differential:</b> ${escapeHTML(c.differentials)}</p><p><b>Next steps:</b> ${escapeHTML(c.plan)}</p><p><b>Case score:</b> ${a.score} / ${max}</p><p class="small">Source theme: ${escapeHTML(c.source)}. Fictional composite, not a reproduced patient record.</p></div>${btn('Next patient','nextCase()','pink')}${btn('Case board','clinic()','blue')}${btn('Study condition',`lesson(${c.id})`)}`}
else if(a.tab==='interview'){body=`<div class="heading">ASK THE PATIENT</div><p class="small">Select focused questions. Each new information request costs 7 points. A safety assessment is free.</p>${[['timeline','Ask about onset and timeline'],['background','Ask about past and family history'],['function','Ask about daily functioning'],['safety','Screen for immediate red flags']].map(([k,label])=>`<button class="btn choice" onclick="reveal('${k}')" ${a.seen.includes(k)?'disabled':''}>${a.seen.includes(k)?'✓ ':''}${label} <span class="small">${k==='safety'?'FREE':'−7 points'}</span></button>`).join('')}`}
else if(a.tab==='exam'){body=`<div class="heading">PHYSICAL / MENTAL STATUS EXAM</div><p>Choose a focused examination to obtain objective findings.</p>${btn(a.seen.includes('exam')?'✓ Examination complete':'Perform focused examination (−8)',"reveal('exam')",'blue')}<div class="notice">${escapeHTML(safetyFor(c))}</div>${btn('✓ Mark emergency screen complete','urgent()','mint')}`}
else if(a.tab==='tests'){body=`<div class="heading">ORDER & INTERPRET TESTS</div><p class="small">The two case-specific tests are available here. These are authored educational reports; the drawings are synthetic visual aids, not diagnostic images.</p>${keys.map((name,i)=>{let k='test'+i,seen=a.seen.includes(k);let ch=testChallenge(c,k);return `<div class="card" style="margin-bottom:12px"><b>${escapeHTML(name)}</b><p>${btn(seen?'✓ Report unlocked':'Order investigation (−14)',`reveal('${k}')`,seen?'mint':'blue')}</p>${seen?`${testVisual(c,name,ch.result)}<div class="panel"><b>Clinical report</b><p>${escapeHTML(ch.result)}</p></div><p><b>Interpretation challenge:</b> Which statement best reflects this result?</p>${ch.opts.map((opt,j)=>`<button class="btn choice" onclick="interpret('${k}',${j})" ${a.testAnswers[k]?'disabled':''}>${escapeHTML(opt)}</button>`).join('')}${a.testAnswers[k]?`<div class="panel ${a.testAnswers[k]==='correct'?'mint':'pink'}">${a.testAnswers[k]==='correct'?'Correct interpretation!':'Review: the report supports the finding described above, but cannot by itself establish every clinical conclusion.'}</div>`:''}`:''}</div>`}).join('')}</div>`}
else{body=`<div class="heading">YOUR DIFFERENTIAL DIAGNOSIS</div><p class="small">Select plausible alternatives to track them, or submit the leading diagnosis below. Synonyms and common abbreviations are accepted for supported diagnoses. Incorrect guesses unlock clues but cost points.</p><div class="choicegrid">${choices(c).map(d=>`<button class="btn choice ${a.differential.includes(d)?'selected':''}" onclick="toggleDifferential(decodeURIComponent('${encodeURIComponent(d)}'))">${a.differential.includes(d)?'☑':'☐'} ${escapeHTML(d)}</button>`).join('')}</div><p class="small">Working differential: ${a.differential.length?a.differential.map(escapeHTML).join(' · '):'None selected yet'}</p><hr class="divider"><label for="freeDx"><b>Enter final diagnosis</b></label><input id="freeDx" class="search" placeholder="e.g., migraine with aura" autocomplete="off" onkeydown="if(event.key==='Enter')submitFree()"><p>${btn('✚ Submit written diagnosis','submitFree()','pink')}</p><p class="small">Or submit one of these diagnoses directly:</p><div class="choicegrid">${choices(c).map(d=>`<button class="btn choice" onclick="diagnose(decodeURIComponent('${encodeURIComponent(d)}'))">${escapeHTML(d)}</button>`).join('')}</div>`}
$('#root').innerHTML=box(`PATIENT #${String(c.id).padStart(3,'0')} / LEVEL ${c.level}`,`<div class="casehead">${avatar(c.id)}<div><span class="tag">${escapeHTML(c.category)}</span><div class="heading">NEW PATIENT ARRIVAL</div><p><b>${c.age}-year-old ${escapeHTML(c.sex)}</b></p><p>“${escapeHTML(c.chief)}”</p></div></div><div class="flex" style="justify-content:space-between;align-items:center"><b>★ ${a.score} / ${max} points</b><span class="hearts">${'♥'.repeat(Math.max(1,3-Math.min(a.wrong,2)))}</span></div><div class="progress"><div class="fill" style="width:${a.score/max*100}%"></div></div>${a.feedback&&!a.finished?`<div class="notice">${escapeHTML(a.feedback==='safety'?'Safety review completed without a score penalty.':a.feedback)}</div>`:''}${a.finished?body:`<div class="columns"><div><div class="heading">PATIENT CHART</div><div class="chartscroll">${chart||'<div class="panel">Limited information available. Interview your patient and order targeted investigations.</div>'}</div></div><div><div class="tabs">${tabs.map(([k,v])=>`<button class="btn ${a.tab===k?'pink':'tab'}" onclick="switchTab('${k}')">${v}</button>`).join('')}</div>${body}<p>${btn('← Case board','clinic()')}</p></div></div>`}`);persist()}

home();
</script></body></html>
